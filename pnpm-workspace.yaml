# Security overrides: force patched versions of vulnerable transitive deps
# (flagged by `pnpm audit`). All are patch/minor bumps within the same major.
overrides:
  postcss: ^8.5.23
  nanoid@3: ^3.3.18
  browserslist: ^4.28.7
  source-map-js: ^1.2.2
  mdast-util-to-hast: ^13.2.1
  baseline-browser-mapping: ^2.11.0
  sharp: ^0.35.5
  # undici 5 (via @ai-sdk/provider-utils) has request-smuggling/DoS advisories;
  # the Agent/fetch APIs it uses are unchanged in 6.x.
  undici: ^6.28.1
